
spring.application.name=luxora

# ==========================
# DATABASE
# ==========================
# Use "postgres" when the PostgreSQL Compose service is named postgres.
# For local development outside Docker, use localhost instead.
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/luxora}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================
# JPA / HIBERNATE
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==========================
# GOLD API
# ==========================
goldapi.url=https://www.goldapi.io/api
goldapi.key=${GOLDAPI_KEY:}

# ==========================
# SERVER
# ==========================
server.port=8080

# ==========================
# RAZORPAY
# ==========================
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# ==========================
# JWT
# ==========================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ==========================
# LOGGING
# ==========================
logging.level.org.springframework.security=INFO


services:
  postgres:
    image: postgres:16
    container_name: luxora-postgres
    environment:
      POSTGRES_DB: luxora
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
    volumes:
      - my-volumes:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - shared-network
    restart: unless-stopped


  app:
    image: santosh6363/jwellary_backend-app:latest
    container_name: luxora-backend
    ports:
      - "8080:8080"
    env_file:
      - /home/ubuntu/luxora-backend-env.txt
    environment:
      DB_URL: jdbc:postgresql://luxora-postgres:5432/luxora
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file}
      JWT_EXPIRATION: 86400000
      GOLDAPI_KEY: ${GOLDAPI_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shared-network
    restart: unless-stopped


volumes:
  my-volumes:

networks:
  shared-network:
    external: true
    name: jewellery-shared-network

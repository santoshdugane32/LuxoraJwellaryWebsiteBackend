
services:
  app:
    image: santosh6363/jwellary_backend-app:latest
    container_name: luxora-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/luxora
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-123}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shared-network
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: luxora-postgres
    environment:
      POSTGRES_DB: luxora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
    volumes:
      - my-volumes:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d luxora"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shared-network
    restart: unless-stopped

volumes:
  my-volumes:

networks:
  shared-network:
    external: true
    name: jewellery-shared-network
